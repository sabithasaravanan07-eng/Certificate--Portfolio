{% extends "base.html" %}
{% block title %}Change password | {{ site.name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block content %}
<section class="block"><div class="wrap auth">
  <h1>Change password</h1>
  {% if errors %}<div class="alert" role="alert"><ul>{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul></div>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <span class="hint">At least 10 characters</span><input type="password" name="new" autocomplete="new-password" minlength="10" required></label>
    <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" minlength="10" required></label>
    <p class="admin-links"><button class="btn" type="submit">Save password</button> <a class="btn btn-ghost" href="{{ url_for('admin_dashboard') }}">Cancel</a></p>
  </form>
</div></section>
{% endblock %}
